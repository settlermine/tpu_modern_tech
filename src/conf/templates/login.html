{% extends 'base.html' %}

{% block title %}Вход - Видеотека{% endblock %}

{% block content %}
<div class="login-container">
    <h1>Вход</h1>

    {% if form.errors %}
    <div class="messages">
        <div class="message message-error">
            Неверное имя пользователя или пароль.
        </div>
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="login-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username" class="form-label">
                Имя пользователя:
            </label>
            <input
                type="text"
                name="username"
                id="id_username"
                required
                class="form-input"
            >
        </div>
        <div class="form-group">
            <label for="id_password" class="form-label">
                Пароль:
            </label>
            <input
                type="password"
                name="password"
                id="id_password"
                required
                class="form-input"
            >
        </div>
        <button type="submit" class="btn btn-like" style="width: 100%;">
            Войти
        </button>
    </form>
</div>
{% endblock %}
